[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "recoil-calibration-lab"
version = "0.8.0rc1"
description = "Local calibration workbench with supervised Windows test workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
ui = ["pillow>=10,<13", "opencv-python-headless>=4.10,<5"]
video = ["opencv-python-headless>=4.10,<5"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
recoil-lab = "recoil_lab.cli:main"
recoil-lab-app = "recoil_lab.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.package-data]
recoil_lab = ["web/*.html", "web/*.css", "web/*.js"]
