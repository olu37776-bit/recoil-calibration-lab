name: Verification System
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-video:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test,video,ui]"
      - run: python -m pytest -q --junitxml=runs/junit.xml --cov=recoil_lab --cov-report=term-missing --cov-report=json:runs/coverage.json
      - run: python -m recoil_lab demo --out runs/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: runs/
