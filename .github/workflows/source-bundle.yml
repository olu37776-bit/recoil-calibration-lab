name: Source Bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p source-package
          git archive --format=zip --prefix=recoil-calibration-lab/ HEAD > source-package/recoil-calibration-lab-source.zip
          git rev-parse HEAD > source-package/source-commit.txt
          cd source-package
          sha256sum recoil-calibration-lab-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Source-Bundle
          path: source-package/
          if-no-files-found: error
