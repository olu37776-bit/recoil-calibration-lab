name: Simple Native Windows Product
on:
  push:
    branches: [main, 'feature/simple-manual-*']
    paths:
      - 'src/recoil_lab/simple_*'
      - 'tests/test_simple_*'
      - 'tools/*simple*'
      - '.github/workflows/simple.yml'
      - 'docs/SIMPLE_MODE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,ui,video]"
      - run: python -m pytest -q tests --junitxml=runs/simple-full-regression.xml
        timeout-minutes: 3
      - if: runner.os == 'Windows'
        run: python -m recoil_lab.simple_app --self-test runs/simple-native.json
        timeout-minutes: 1
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m recoil_lab.simple_app --self-test runs/simple-native.json
        timeout-minutes: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Simple-Verification-${{ runner.os }}
          path: runs/
          if-no-files-found: error
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[ui,video]" pillow==12.3.0 pyinstaller==6.22.3
      - run: python tools/build_simple.py
      - name: Source snapshot
        shell: bash
        run: git archive --format=zip --output=dist/RecoilLab-Simple-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: RecoilLab-Simple-Windows
          path: |
            dist/RecoilLab-Simple.exe
            dist/RecoilLab-Simple.exe.sha256
            dist/RecoilLab-Simple-source.zip
            runs/simple-frozen.json
            runs/simple-windows.png
            runs/guide-prepare.png
            runs/guide-feedback.png
            runs/daily-toggle.png
            runs/panel-home.png
            runs/panel-config.png
          if-no-files-found: error
  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RecoilLab-Simple-Windows
          path: release
      - name: Publish tested manual candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f release/dist/RecoilLab-Simple.exe
          (cd release/dist && sha256sum -c RecoilLab-Simple.exe.sha256)
          VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); from recoil_lab.simple_core import VERSION; print(VERSION)")
          TAG="simple-v${VERSION}-${GITHUB_SHA:0:7}"
          gh release create "$TAG" release/dist/RecoilLab-Simple.exe release/dist/RecoilLab-Simple.exe.sha256 release/dist/RecoilLab-Simple-source.zip --target "$GITHUB_SHA" --prerelease --title "RecoilLab 简易手动调教版 $TAG" --notes "Two-page manual tool: home selects presets, configuration page includes tuning. Both use the same one-press hotkey. No prepare button or countdown; exact-title target discovery starts an OFF listener, never input. New installs default explicitly to left-button trigger. Draft tuning, save/copy/undo and Windows-input diagnostics. Native/frozen tests include the actual PanelApplication entrypoint. Game acceptance and physical hardware remain unverified. Main V0.8 unchanged."
